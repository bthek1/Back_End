<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Singleton, scoped and transient service lifetimes across two HTTP requests</title>
  <rect width="960" height="400" fill="#ffffff"/>

  <!-- Application -->
  <rect x="20" y="20" width="920" height="360" rx="10" fill="#f8fafc" stroke="#475569"/>
  <text x="40" y="46" font-weight="bold" font-size="15">Application lifetime</text>

  <!-- Singleton -->
  <rect x="40" y="62" width="880" height="48" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="480" y="82" text-anchor="middle" font-weight="bold">Singleton: one instance</text>
  <text x="480" y="100" text-anchor="middle" fill="#475569">Shared by every request. It must be thread-safe.</text>

  <!-- Request 1 -->
  <rect x="40" y="130" width="425" height="232" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="60" y="156" font-weight="bold">HTTP request 1 (one scope)</text>
  <rect x="60" y="170" width="385" height="56" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text x="252" y="193" text-anchor="middle" font-weight="bold">Scoped: instance A</text>
  <text x="252" y="212" text-anchor="middle" fill="#475569">Same object for the whole request</text>
  <rect x="60" y="244" width="115" height="96" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="117" y="284" text-anchor="middle" font-weight="bold">Transient</text>
  <text x="117" y="304" text-anchor="middle" fill="#475569">instance 1</text>
  <rect x="195" y="244" width="115" height="96" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="252" y="284" text-anchor="middle" font-weight="bold">Transient</text>
  <text x="252" y="304" text-anchor="middle" fill="#475569">instance 2</text>
  <rect x="330" y="244" width="115" height="96" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="387" y="284" text-anchor="middle" font-weight="bold">Transient</text>
  <text x="387" y="304" text-anchor="middle" fill="#475569">instance 3</text>

  <!-- Request 2 -->
  <rect x="495" y="130" width="425" height="232" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="515" y="156" font-weight="bold">HTTP request 2 (new scope)</text>
  <rect x="515" y="170" width="385" height="56" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text x="707" y="193" text-anchor="middle" font-weight="bold">Scoped: instance B</text>
  <text x="707" y="212" text-anchor="middle" fill="#475569">Disposed when the request ends</text>
  <rect x="515" y="244" width="182" height="96" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="606" y="284" text-anchor="middle" font-weight="bold">Transient</text>
  <text x="606" y="304" text-anchor="middle" fill="#475569">instance 4</text>
  <rect x="718" y="244" width="182" height="96" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="809" y="284" text-anchor="middle" font-weight="bold">Transient</text>
  <text x="809" y="304" text-anchor="middle" fill="#475569">instance 5</text>
</svg>
