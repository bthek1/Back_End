<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>How C# source becomes running code on .NET</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="#ffffff"/>

  <text x="20" y="30" font-weight="bold" font-size="15" fill="#0f172a">Build time</text>
  <text x="560" y="30" font-weight="bold" font-size="15" fill="#0f172a">Run time</text>
  <line x1="535" y1="16" x2="535" y2="384" stroke="#cbd5e1" stroke-dasharray="6 4"/>

  <!-- Source -->
  <rect x="20" y="150" width="130" height="76" rx="8" fill="#f1f5f9" stroke="#475569"/>
  <text x="85" y="176" text-anchor="middle" font-weight="bold">Source</text>
  <text x="85" y="195" text-anchor="middle" fill="#475569">.cs files</text>
  <text x="85" y="212" text-anchor="middle" fill="#475569">.csproj</text>

  <!-- Roslyn -->
  <rect x="190" y="150" width="130" height="76" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="255" y="176" text-anchor="middle" font-weight="bold">Roslyn</text>
  <text x="255" y="195" text-anchor="middle" fill="#475569">C# compiler</text>
  <text x="255" y="212" text-anchor="middle" fill="#475569">dotnet build</text>

  <!-- IL -->
  <rect x="360" y="70" width="150" height="76" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="435" y="96" text-anchor="middle" font-weight="bold">IL in a .dll</text>
  <text x="435" y="115" text-anchor="middle" fill="#475569">portable bytecode</text>
  <text x="435" y="132" text-anchor="middle" fill="#475569">default path</text>

  <!-- ILC -->
  <rect x="360" y="250" width="150" height="76" rx="8" fill="#ffedd5" stroke="#c2410c"/>
  <text x="435" y="276" text-anchor="middle" font-weight="bold">Native AOT</text>
  <text x="435" y="295" text-anchor="middle" fill="#475569">ahead-of-time build</text>
  <text x="435" y="312" text-anchor="middle" fill="#475569">dotnet publish</text>

  <!-- CLR container -->
  <rect x="560" y="46" width="380" height="130" rx="10" fill="#ecfdf5" stroke="#047857" stroke-dasharray="6 4"/>
  <text x="575" y="68" font-weight="bold" fill="#047857">CLR (the .NET runtime)</text>
  <rect x="575" y="82" width="165" height="78" rx="6" fill="#ffffff" stroke="#047857"/>
  <text x="657" y="106" text-anchor="middle" font-weight="bold">JIT compiler</text>
  <text x="657" y="125" text-anchor="middle" fill="#475569">IL to machine code,</text>
  <text x="657" y="142" text-anchor="middle" fill="#475569">tuned for hot methods</text>
  <rect x="760" y="82" width="165" height="78" rx="6" fill="#ffffff" stroke="#047857"/>
  <text x="842" y="106" text-anchor="middle" font-weight="bold">Runtime services</text>
  <text x="842" y="125" text-anchor="middle" fill="#475569">garbage collector,</text>
  <text x="842" y="142" text-anchor="middle" fill="#475569">threads, type safety</text>

  <!-- Native binary -->
  <rect x="560" y="250" width="380" height="76" rx="8" fill="#fff7ed" stroke="#c2410c"/>
  <text x="750" y="276" text-anchor="middle" font-weight="bold">Single native executable</text>
  <text x="750" y="295" text-anchor="middle" fill="#475569">fast start, low memory, no JIT</text>
  <text x="750" y="312" text-anchor="middle" fill="#475569">one OS and CPU target per build</text>

  <!-- Arrows -->
  <line x1="150" y1="188" x2="188" y2="188" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M320,172 C340,172 338,108 358,108" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M320,204 C340,204 338,288 358,288" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="510" y1="108" x2="558" y2="108" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="510" y1="288" x2="558" y2="288" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
