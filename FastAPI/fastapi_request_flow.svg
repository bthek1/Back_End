<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="#ffffff"/>

  <!-- Client -->
  <rect x="20" y="150" width="110" height="60" rx="8" fill="#f1f5f9" stroke="#475569"/>
  <text x="75" y="176" text-anchor="middle" font-weight="bold">Client</text>
  <text x="75" y="194" text-anchor="middle" fill="#475569">React SPA, curl</text>

  <!-- Uvicorn -->
  <rect x="165" y="150" width="120" height="60" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="225" y="176" text-anchor="middle" font-weight="bold">Uvicorn</text>
  <text x="225" y="194" text-anchor="middle" fill="#475569">ASGI server</text>

  <!-- FastAPI app container -->
  <rect x="320" y="40" width="390" height="280" rx="10" fill="#ecfdf5" stroke="#047857" stroke-dasharray="6 4"/>
  <text x="335" y="62" font-weight="bold" fill="#047857">FastAPI app (Starlette underneath)</text>

  <rect x="340" y="80" width="160" height="44" rx="6" fill="#ffffff" stroke="#047857"/>
  <text x="420" y="100" text-anchor="middle" font-weight="bold">Middleware</text>
  <text x="420" y="116" text-anchor="middle" fill="#475569">CORS, logging, timing</text>

  <rect x="340" y="140" width="160" height="44" rx="6" fill="#ffffff" stroke="#047857"/>
  <text x="420" y="160" text-anchor="middle" font-weight="bold">APIRouter</text>
  <text x="420" y="176" text-anchor="middle" fill="#475569">match path + method</text>

  <rect x="340" y="200" width="160" height="44" rx="6" fill="#ffffff" stroke="#047857"/>
  <text x="420" y="220" text-anchor="middle" font-weight="bold">Pydantic validation</text>
  <text x="420" y="236" text-anchor="middle" fill="#475569">body, query, path</text>

  <rect x="530" y="80" width="160" height="104" rx="6" fill="#ffffff" stroke="#047857"/>
  <text x="610" y="100" text-anchor="middle" font-weight="bold">Dependencies</text>
  <text x="610" y="122" text-anchor="middle" fill="#475569">Settings</text>
  <text x="610" y="140" text-anchor="middle" fill="#475569">AsyncSession</text>
  <text x="610" y="158" text-anchor="middle" fill="#475569">current_user (JWT)</text>
  <text x="610" y="176" text-anchor="middle" fill="#475569">pagination params</text>

  <rect x="530" y="200" width="160" height="44" rx="6" fill="#ffffff" stroke="#047857"/>
  <text x="610" y="220" text-anchor="middle" font-weight="bold">Path operation</text>
  <text x="610" y="236" text-anchor="middle" fill="#475569">async def endpoint</text>

  <rect x="430" y="262" width="180" height="44" rx="6" fill="#ffffff" stroke="#047857"/>
  <text x="520" y="282" text-anchor="middle" font-weight="bold">response_model</text>
  <text x="520" y="298" text-anchor="middle" fill="#475569">filter + serialise to JSON</text>

  <!-- Service and DB -->
  <rect x="750" y="190" width="190" height="60" rx="8" fill="#eff6ff" stroke="#1d4ed8"/>
  <text x="845" y="215" text-anchor="middle" font-weight="bold">SQLAlchemy 2.0</text>
  <text x="845" y="233" text-anchor="middle" fill="#475569">AsyncSession + psycopg 3</text>

  <rect x="750" y="300" width="190" height="60" rx="8" fill="#eff6ff" stroke="#1d4ed8"/>
  <text x="845" y="325" text-anchor="middle" font-weight="bold">PostgreSQL</text>
  <text x="845" y="343" text-anchor="middle" fill="#475569">schema owned by Alembic</text>

  <rect x="750" y="60" width="190" height="60" rx="8" fill="#fdf2f8" stroke="#be185d"/>
  <text x="845" y="85" text-anchor="middle" font-weight="bold">Celery + Redis</text>
  <text x="845" y="103" text-anchor="middle" fill="#475569">slow work, off the request</text>

  <!-- Arrows -->
  <line x1="130" y1="180" x2="163" y2="180" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="285" y1="180" x2="338" y2="104" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="420" y1="124" x2="420" y2="138" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="420" y1="184" x2="420" y2="198" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="500" y1="222" x2="528" y2="222" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="610" y1="184" x2="610" y2="198" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="690" y1="222" x2="748" y2="220" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="845" y1="250" x2="845" y2="298" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="690" y1="140" x2="748" y2="100" stroke="#be185d" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text x="700" y="112" fill="#be185d" font-size="11">.delay()</text>
  <line x1="580" y1="244" x2="560" y2="260" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M430 284 L75 284 L75 212" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="200" y="278" fill="#475569" font-size="11">JSON response</text>
</svg>
