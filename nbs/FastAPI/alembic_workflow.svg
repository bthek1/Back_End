<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="300" fill="#ffffff"/>

  <rect x="20" y="40" width="160" height="70" rx="8" fill="#eff6ff" stroke="#1d4ed8"/>
  <text x="100" y="66" text-anchor="middle" font-weight="bold">1. Edit models</text>
  <text x="100" y="86" text-anchor="middle" fill="#475569">models.py</text>
  <text x="100" y="102" text-anchor="middle" fill="#475569">Base.metadata</text>

  <rect x="220" y="40" width="170" height="70" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="305" y="66" text-anchor="middle" font-weight="bold">2. Autogenerate</text>
  <text x="305" y="86" text-anchor="middle" fill="#475569">alembic revision</text>
  <text x="305" y="102" text-anchor="middle" fill="#475569">--autogenerate -m "..."</text>

  <rect x="430" y="40" width="170" height="70" rx="8" fill="#fdf2f8" stroke="#be185d"/>
  <text x="515" y="66" text-anchor="middle" font-weight="bold">3. Read and fix</text>
  <text x="515" y="86" text-anchor="middle" fill="#475569">renames, data moves,</text>
  <text x="515" y="102" text-anchor="middle" fill="#475569">enums, server defaults</text>

  <rect x="640" y="40" width="140" height="70" rx="8" fill="#ecfdf5" stroke="#047857"/>
  <text x="710" y="66" text-anchor="middle" font-weight="bold">4. Apply</text>
  <text x="710" y="86" text-anchor="middle" fill="#475569">alembic upgrade</text>
  <text x="710" y="102" text-anchor="middle" fill="#475569">head</text>

  <rect x="820" y="40" width="120" height="70" rx="8" fill="#f1f5f9" stroke="#475569"/>
  <text x="880" y="66" text-anchor="middle" font-weight="bold">5. Commit</text>
  <text x="880" y="86" text-anchor="middle" fill="#475569">model + revision</text>
  <text x="880" y="102" text-anchor="middle" fill="#475569">in one change</text>

  <line x1="180" y1="75" x2="218" y2="75" stroke="#475569" stroke-width="1.6" marker-end="url(#b)"/>
  <line x1="390" y1="75" x2="428" y2="75" stroke="#475569" stroke-width="1.6" marker-end="url(#b)"/>
  <line x1="600" y1="75" x2="638" y2="75" stroke="#475569" stroke-width="1.6" marker-end="url(#b)"/>
  <line x1="780" y1="75" x2="818" y2="75" stroke="#475569" stroke-width="1.6" marker-end="url(#b)"/>

  <!-- How autogenerate compares -->
  <rect x="140" y="170" width="200" height="60" rx="8" fill="#eff6ff" stroke="#1d4ed8"/>
  <text x="240" y="195" text-anchor="middle" font-weight="bold">Desired state</text>
  <text x="240" y="213" text-anchor="middle" fill="#475569">target_metadata (Python)</text>

  <rect x="620" y="170" width="200" height="60" rx="8" fill="#eff6ff" stroke="#1d4ed8"/>
  <text x="720" y="195" text-anchor="middle" font-weight="bold">Actual state</text>
  <text x="720" y="213" text-anchor="middle" fill="#475569">live database (reflected)</text>

  <rect x="400" y="175" width="160" height="50" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="480" y="197" text-anchor="middle" font-weight="bold">diff</text>
  <text x="480" y="214" text-anchor="middle" fill="#475569">ops in upgrade()</text>

  <line x1="340" y1="200" x2="398" y2="200" stroke="#475569" stroke-width="1.6" marker-end="url(#b)"/>
  <line x1="620" y1="200" x2="562" y2="200" stroke="#475569" stroke-width="1.6" marker-end="url(#b)"/>
  <line x1="480" y1="175" x2="320" y2="112" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#b)"/>

  <text x="480" y="265" text-anchor="middle" fill="#475569">The database must be at head before you autogenerate, or the diff includes old revisions again.</text>
  <text x="480" y="283" text-anchor="middle" fill="#475569">alembic_version table stores the current revision id.</text>
</svg>
