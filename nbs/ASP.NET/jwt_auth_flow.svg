<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>A client gets a JWT from an identity provider and the API validates it before it runs the handler</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="330" fill="#ffffff"/>

  <!-- Identity provider -->
  <rect x="330" y="20" width="240" height="64" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="450" y="47" text-anchor="middle" font-weight="bold">Identity provider</text>
  <text x="450" y="67" text-anchor="middle" fill="#475569">signs tokens with a private key</text>

  <!-- Client -->
  <rect x="20" y="170" width="150" height="90" rx="8" fill="#f1f5f9" stroke="#475569"/>
  <text x="95" y="210" text-anchor="middle" font-weight="bold">Client</text>
  <text x="95" y="230" text-anchor="middle" fill="#475569">holds the JWT</text>

  <!-- API -->
  <rect x="290" y="140" width="650" height="170" rx="10" fill="#f8fafc" stroke="#475569"/>
  <text x="310" y="164" font-weight="bold" font-size="15">ASP.NET Core API</text>

  <rect x="310" y="180" width="180" height="104" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="400" y="208" text-anchor="middle" font-weight="bold">Authentication</text>
  <text x="400" y="230" text-anchor="middle" fill="#475569">checks signature,</text>
  <text x="400" y="248" text-anchor="middle" fill="#475569">issuer, audience, expiry</text>
  <text x="400" y="268" text-anchor="middle" fill="#b91c1c">fail: 401</text>

  <rect x="530" y="180" width="180" height="104" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="620" y="208" text-anchor="middle" font-weight="bold">Authorization</text>
  <text x="620" y="230" text-anchor="middle" fill="#475569">evaluates the</text>
  <text x="620" y="248" text-anchor="middle" fill="#475569">endpoint policy</text>
  <text x="620" y="268" text-anchor="middle" fill="#b91c1c">fail: 403</text>

  <rect x="750" y="180" width="170" height="104" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text x="835" y="225" text-anchor="middle" font-weight="bold">Handler</text>
  <text x="835" y="247" text-anchor="middle" fill="#475569">reads the claims</text>

  <!-- Arrows -->
  <path d="M95,170 L95,52 L328,52" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="205" y="42" text-anchor="middle" fill="#475569">1. sign in, receive JWT</text>

  <line x1="170" y1="232" x2="308" y2="232" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="238" y="222" text-anchor="middle" fill="#475569">2. Bearer token</text>

  <line x1="400" y1="178" x2="400" y2="86" stroke="#475569" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="494" y="118" text-anchor="middle" fill="#475569">3. fetch public keys (cached)</text>

  <line x1="490" y1="232" x2="528" y2="232" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="710" y1="232" x2="748" y2="232" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
</svg>
