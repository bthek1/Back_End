<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>How a request moves through an ASP.NET Core application</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="#ffffff"/>

  <!-- Client -->
  <rect x="20" y="150" width="100" height="60" rx="8" fill="#f1f5f9" stroke="#475569"/>
  <text x="70" y="176" text-anchor="middle" font-weight="bold">Client</text>
  <text x="70" y="194" text-anchor="middle" fill="#475569">SPA, curl</text>

  <!-- Kestrel -->
  <rect x="150" y="150" width="100" height="60" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="200" y="176" text-anchor="middle" font-weight="bold">Kestrel</text>
  <text x="200" y="194" text-anchor="middle" fill="#475569">HTTP server</text>

  <!-- App container -->
  <rect x="280" y="30" width="480" height="340" rx="10" fill="#ecfdf5" stroke="#047857" stroke-dasharray="6 4"/>
  <text x="295" y="52" font-weight="bold" fill="#047857">ASP.NET Core application (one process)</text>

  <!-- Middleware column -->
  <text x="385" y="76" text-anchor="middle" font-weight="bold" fill="#047857">Middleware, in order</text>
  <rect x="300" y="86" width="170" height="38" rx="6" fill="#ffffff" stroke="#047857"/>
  <text x="385" y="110" text-anchor="middle">Exception handler</text>
  <rect x="300" y="134" width="170" height="38" rx="6" fill="#ffffff" stroke="#047857"/>
  <text x="385" y="158" text-anchor="middle">Routing</text>
  <rect x="300" y="182" width="170" height="38" rx="6" fill="#ffffff" stroke="#047857"/>
  <text x="385" y="206" text-anchor="middle">CORS</text>
  <rect x="300" y="230" width="170" height="38" rx="6" fill="#ffffff" stroke="#047857"/>
  <text x="385" y="254" text-anchor="middle">Authentication</text>
  <rect x="300" y="278" width="170" height="38" rx="6" fill="#ffffff" stroke="#047857"/>
  <text x="385" y="302" text-anchor="middle">Authorization</text>

  <!-- Endpoint column -->
  <text x="625" y="76" text-anchor="middle" font-weight="bold" fill="#047857">Matched endpoint</text>
  <rect x="520" y="86" width="210" height="58" rx="6" fill="#ffffff" stroke="#047857"/>
  <text x="625" y="110" text-anchor="middle" font-weight="bold">Parameter binding</text>
  <text x="625" y="129" text-anchor="middle" fill="#475569">route, query, JSON body</text>
  <rect x="520" y="164" width="210" height="58" rx="6" fill="#ffffff" stroke="#047857"/>
  <text x="625" y="188" text-anchor="middle" font-weight="bold">Dependency injection</text>
  <text x="625" y="207" text-anchor="middle" fill="#475569">services for this request</text>
  <rect x="520" y="242" width="210" height="58" rx="6" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="625" y="266" text-anchor="middle" font-weight="bold">Your handler</text>
  <text x="625" y="285" text-anchor="middle" fill="#475569">returns a typed result</text>
  <text x="625" y="340" text-anchor="middle" fill="#475569">Response returns via middleware</text>

  <!-- Data -->
  <rect x="800" y="242" width="140" height="58" rx="8" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="870" y="266" text-anchor="middle" font-weight="bold">PostgreSQL</text>
  <text x="870" y="285" text-anchor="middle" fill="#475569">through EF Core</text>

  <!-- Arrows -->
  <line x1="120" y1="180" x2="148" y2="180" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M250,180 C268,180 268,105 298,105" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="385" y1="124" x2="385" y2="132" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="385" y1="172" x2="385" y2="180" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="385" y1="220" x2="385" y2="228" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="385" y1="268" x2="385" y2="276" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M470,297 C505,297 485,115 518,115" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="625" y1="144" x2="625" y2="162" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="625" y1="222" x2="625" y2="240" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="730" y1="271" x2="798" y2="271" stroke="#475569" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
</svg>
